[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surveyclean"
version = "0.1.0"
description = "Clean KoboToolbox / ODK survey exports and produce a data quality report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alfred Kombo Emali" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
surveyclean = "surveyclean.cli:main"

[tool.setuptools]
packages = ["surveyclean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
